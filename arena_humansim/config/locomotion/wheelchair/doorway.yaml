# Single subject lining up with and crossing a 0.9m doorway from a 1.5m lateral offset.

name: wheelchair_doorway
description: >-
  Two rooms joined by a 0.9m doorway at the origin. The subject starts 5m
  before the wall, 1.5m off the door axis, and crosses to a goal 5m behind
  it on the axis. No other agents.

simulation:
  seed: 1
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 800

modules:
  global_planner: navmesh

agents:
  - agent_id: 1000
    agent_type: wheelchair_manual
    desired_velocity: 0.0
    agent_radius: 0.0
    spawn_pose: {x: -5.0, y: 1.5, theta: 0.0}
    goal_sequence: [{x: 5.0, y: 0.0}]

walls:
  - {name: north,     start: {x: -7.0, y:  4.0},  end: {x: 7.0, y:  4.0}}
  - {name: south,     start: {x: -7.0, y: -4.0},  end: {x: 7.0, y: -4.0}}
  - {name: west,      start: {x: -7.0, y: -4.0},  end: {x: -7.0, y: 4.0}}
  - {name: east,      start: {x:  7.0, y: -4.0},  end: {x:  7.0, y: 4.0}}
  - {name: divider_n, start: {x:  0.0, y:  0.45}, end: {x: 0.0, y:  4.0}}
  - {name: divider_s, start: {x:  0.0, y: -0.45}, end: {x: 0.0, y: -4.0}}

interaction_scripts: []
