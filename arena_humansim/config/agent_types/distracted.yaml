# A phone-walker: unhurried, head down, seeing two metres of the world and reacting late.
#
# Speed is a little under adult; the difference is perception. A vision range of 2 m and a
# 90 degree field of view mean the robot enters this agent's awareness at about the distance
# where an evasive step is already too late, and a long relaxation time means the step,
# when it comes, is slow. Repulsion is nominal - once they do see you, they yield like anyone.
name: distracted
extends: adult
desired_velocity: {mean: 0.95, std: 0.12, clip_low: 0.5, clip_high: 1.3}
max_acceleration: {mean: 1.2, std: 0.1, clip_low: 0.5, clip_high: 2.0}
max_deceleration: {mean: 2.0, std: 0.2, clip_low: 1.0, clip_high: 3.5}
idle_gaze_rate: {mean: 0.05, std: 0.03, clip_low: 0.0, clip_high: 0.2}
perception:
  vision_range: {mean: 2.0, std: 0.4, clip_low: 1.0, clip_high: 3.5}
  vision_fov: {mean: 90.0, std: 15.0, clip_low: 60.0, clip_high: 130.0}
local_planner_params:
  relaxation_time: {mean: 0.9, std: 0.1, clip_low: 0.5, clip_high: 1.5}
  repulsion_strength: {mean: 1.8, std: 0.2, clip_low: 0.5, clip_high: 4.0}
  repulsion_range: {mean: 0.35, std: 0.04, clip_low: 0.15, clip_high: 0.8}
