# Someone late: fast, cutting close, eyes on where they are going and nowhere else.
#
# The pedestrian a social navigator finds hardest to predict is not the slow one but the one
# moving at 1.7 m/s with a narrow field of view who does not slow down for a gap. Speed and
# acceleration sit at the top of the adult range; repulsion strength and range are low, so
# they pass within arm's length; the field of view is a tunnel, so they notice a robot late.
name: hurried
extends: adult
desired_velocity: {mean: 1.7, std: 0.15, clip_low: 1.3, clip_high: 2.2}
max_velocity: {mean: 2.4, std: 0.15, clip_low: 1.6, clip_high: 3.0}
max_acceleration: {mean: 2.2, std: 0.2, clip_low: 1.0, clip_high: 3.5}
max_deceleration: {mean: 3.5, std: 0.3, clip_low: 1.5, clip_high: 5.0}
min_turning_radius: {mean: 0.4, std: 0.04, clip_low: 0.2, clip_high: 0.9}
pivot_angular_velocity: {mean: 2.5, std: 0.25, clip_low: 1.2, clip_high: 4.5}
idle_gaze_rate: {mean: 0.1, std: 0.05, clip_low: 0.0, clip_high: 0.4}
perception:
  vision_range: {mean: 6.0, std: 0.6, clip_low: 3.0, clip_high: 10.0}
  vision_fov: {mean: 140.0, std: 10.0, clip_low: 80.0, clip_high: 200.0}
local_planner_params:
  relaxation_time: {mean: 0.35, std: 0.05, clip_low: 0.15, clip_high: 0.7}
  repulsion_strength: {mean: 1.6, std: 0.2, clip_low: 0.5, clip_high: 3.0}
  repulsion_range: {mean: 0.25, std: 0.03, clip_low: 0.1, clip_high: 0.5}
