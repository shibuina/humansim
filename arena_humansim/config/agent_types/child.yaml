# A child: small, quick, impulsive, and not looking far ahead.
#
# Everything a kinematic type can say is said here; behaviour is `mode: simple`, so a child
# walks its waypoints like an adult and every Level A knob lands. Numbers follow the published
# spread for 6-12 year olds walking with adults: slower on average than an adult but with a
# far wider spread (they stop, then run), a body half the radius, and a reaction that is fast
# rather than considered. The short vision range and low repulsion are what make a child walk
# into a robot's path where an adult would have adjusted three metres out.
name: child
extends: adult
desired_velocity: {mean: 1.0, std: 0.25, clip_low: 0.4, clip_high: 1.8}
agent_radius: {mean: 0.18, std: 0.02, clip_low: 0.12, clip_high: 0.25}
max_velocity: {mean: 2.2, std: 0.2, clip_low: 1.2, clip_high: 3.0}
max_acceleration: {mean: 2.5, std: 0.3, clip_low: 1.0, clip_high: 4.0}
max_deceleration: {mean: 3.5, std: 0.3, clip_low: 1.5, clip_high: 5.0}
min_turning_radius: {mean: 0.15, std: 0.03, clip_low: 0.05, clip_high: 0.4}
pivot_angular_velocity: {mean: 3.5, std: 0.4, clip_low: 1.5, clip_high: 6.0}
idle_gaze_rate: {mean: 0.6, std: 0.15, clip_low: 0.0, clip_high: 1.0}
perception:
  vision_range: {mean: 3.0, std: 0.6, clip_low: 1.0, clip_high: 6.0}
  vision_fov: {mean: 160.0, std: 15.0, clip_low: 90.0, clip_high: 220.0}
local_planner_params:
  relaxation_time: {mean: 0.3, std: 0.05, clip_low: 0.15, clip_high: 0.6}
  repulsion_strength: {mean: 1.5, std: 0.2, clip_low: 0.5, clip_high: 3.0}
  repulsion_range: {mean: 0.25, std: 0.03, clip_low: 0.1, clip_high: 0.5}
