# Single object with capacity 1; small queue forms via FIFO access policy.

name: bt_sparse_queue_use
description: >-
  One fountain with capacity 1 and a FIFO line; 4 seekers exercise the
  USE access policy and queue promotion path.

simulation:
  seed: 73
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 4000
  execution_mode: master

world_objects:
  - object_id: fountain
    type: fountain
    pose: {x: 4.0, y: 0.0, theta: 3.14159}
    capacity: 1
    satisfies: {thirst: 100.0}
    formation:
      type: line
      params: {base_step: 0.8, front_offset: 0.8}

agent_types:
  thirsty:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 1.0, std: 0.15, clip_low: 0.6, clip_high: 1.4}
    initial_sequence: drink
    sequences:
      drink:
        steps:
          queue_and_use:
            target: fountain
            interaction: USE
            duration: {mean: 5.0, std: 1.0, clip_low: 2.0, clip_high: 10.0}
            satisfies: {thirst: 100.0}
        then: drink

agents:
  - {agent_id: 1, agent_type: thirsty, spawn_pose: {x: -4.0, y:  0.5, theta: 0.0}}
  - {agent_id: 2, agent_type: thirsty, spawn_pose: {x: -4.0, y: -0.5, theta: 0.0}}
  - {agent_id: 3, agent_type: thirsty, spawn_pose: {x: -5.0, y:  1.5, theta: 0.0}}
  - {agent_id: 4, agent_type: thirsty, spawn_pose: {x: -5.0, y: -1.5, theta: 0.0}}

walls:
  - {name: fountain_back, start: {x: 3.5, y: -0.4}, end: {x: 3.5, y: 0.4}}

interaction_scripts: []
