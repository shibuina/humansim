# group_walk.yaml
# A family of three walks behind its leader from the west hall to the east hall
# through a 1.4 m corridor and a 2.6 m corridor, then stops.

name: group_walk
description: >-
  Three pedestrians bound into a GROUP_WALK at spawn. Agent 1 leads with its
  own route, agents 2 and 3 hold slots beside it on its trail. The group walks
  abreast in the open, files into a single line in the 1.4 m corridor, spreads
  out abreast again in the 2.6 m corridor, and circles up once the leader stops.

simulation:
  seed: 7
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 900
  execution_mode: master

modules:
  global_planner: navmesh

agents:
  - agent_id: 1
    spawn_pose: {x: -12.0, y: 0.0, theta: 0.0}
    goal_sequence:
      - {x: 15.0, y: 0.0}
    desired_velocity: 1.2

  - agent_id: 2
    spawn_pose: {x: -12.5, y: 1.0, theta: 0.0}
    desired_velocity: 1.3

  - agent_id: 3
    spawn_pose: {x: -12.5, y: -1.0, theta: 0.0}
    desired_velocity: 1.3

interaction_scripts:
  - tick: 0
    interaction_type: GROUP_WALK
    participants: [1, 2, 3]

walls:
  - {name: west_n,    start: {x: -14.0, y:  4.0}, end: {x: -4.0, y:  4.0}}
  - {name: west_s,    start: {x: -14.0, y: -4.0}, end: {x: -4.0, y: -4.0}}
  - {name: west_w,    start: {x: -14.0, y: -4.0}, end: {x: -14.0, y:  4.0}}
  - {name: west_en,   start: {x:  -4.0, y:  0.7}, end: {x: -4.0, y:  4.0}}
  - {name: west_es,   start: {x:  -4.0, y: -4.0}, end: {x: -4.0, y: -0.7}}
  - {name: narrow_n,  start: {x:  -4.0, y:  0.7}, end: {x:  3.0, y:  0.7}}
  - {name: narrow_s,  start: {x:  -4.0, y: -0.7}, end: {x:  3.0, y: -0.7}}
  - {name: step_n,    start: {x:   3.0, y:  0.7}, end: {x:  3.0, y:  1.3}}
  - {name: step_s,    start: {x:   3.0, y: -1.3}, end: {x:  3.0, y: -0.7}}
  - {name: wide_n,    start: {x:   3.0, y:  1.3}, end: {x:  9.0, y:  1.3}}
  - {name: wide_s,    start: {x:   3.0, y: -1.3}, end: {x:  9.0, y: -1.3}}
  - {name: east_wn,   start: {x:   9.0, y:  1.3}, end: {x:  9.0, y:  4.0}}
  - {name: east_ws,   start: {x:   9.0, y: -4.0}, end: {x:  9.0, y: -1.3}}
  - {name: east_n,    start: {x:   9.0, y:  4.0}, end: {x: 19.0, y:  4.0}}
  - {name: east_s,    start: {x:   9.0, y: -4.0}, end: {x: 19.0, y: -4.0}}
  - {name: east_e,    start: {x:  19.0, y: -4.0}, end: {x: 19.0, y:  4.0}}
